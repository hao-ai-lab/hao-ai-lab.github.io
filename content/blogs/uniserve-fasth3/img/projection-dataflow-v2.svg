<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 770" width="1080" height="770" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1080" height="770" fill="#ffffff"/>
<text x="540.0" y="38.0" font-size="21" font-weight="bold" fill="#152638" text-anchor="middle">Gather narrow hidden rows instead of exchanging projected heads</text>
<text x="540.0" y="61.0" font-size="13" font-weight="normal" fill="#556575" text-anchor="middle">One GPU of four (SP4). Block widths scale with channels, heights with rows.</text>
<text x="540.0" y="104.0" font-size="16" font-weight="bold" fill="#152638" text-anchor="middle">FastVideo: project the local rows for all 56 heads, then exchange heads</text>
