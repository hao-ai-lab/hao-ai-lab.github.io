<text x="65.0" y="182.0" font-size="13" font-weight="600" fill="#26384b" text-anchor="start">hidden rows</text>
<text x="65.0" y="199.0" font-size="13" font-weight="normal" fill="#556575" text-anchor="start">S/4 × H</text>
