<text x="858.6" y="176.0" font-size="13" font-weight="600" fill="#7a4b06" text-anchor="start">received: 3SA/4</text>
<text x="858.6" y="193.0" font-size="13" font-weight="normal" fill="#7a4b06" text-anchor="start">= 5376·S elements</text>
<text x="65.0" y="292.0" font-size="13" font-weight="600" fill="#26384b" text-anchor="start">Q/K/V/gate weights per GPU</text>
<rect x="295.0" y="280.0" width="240.0" height="14.0" rx="2" fill="#dfebfa" stroke="#627080" stroke-width="1.2"/>
<text x="545.0" y="292.0" font-size="13" font-weight="normal" fill="#556575" text-anchor="start">all 56 heads: 14.4 GiB (H × 4A per matrix, replicated)</text>
<text x="540.0" y="346.0" font-size="16" font-weight="bold" fill="#152638" text-anchor="middle">UniServe: gather the hidden rows, then project only the local 14 heads</text>
<rect x="65.0" y="370.0" width="74.7" height="34.0" rx="0" fill="#f3f5f8" stroke="#627080" stroke-width="1.2"/>
