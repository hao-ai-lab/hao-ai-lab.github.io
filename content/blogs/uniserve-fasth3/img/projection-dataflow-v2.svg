<text x="317.7" y="392.0" font-size="12" font-weight="normal" fill="#26384b" text-anchor="start">local</text>
<text x="317.7" y="426.0" font-size="12" font-weight="normal" fill="#7a4b06" text-anchor="start">GPU 1</text>
<text x="317.7" y="460.0" font-size="12" font-weight="normal" fill="#7a4b06" text-anchor="start">GPU 2</text>
<text x="317.7" y="494.0" font-size="12" font-weight="normal" fill="#7a4b06" text-anchor="start">GPU 3</text>
<text x="371.7" y="384.0" font-size="13" font-weight="600" fill="#26384b" text-anchor="start">hidden rows of the sequence</text>
<text x="371.7" y="401.0" font-size="13" font-weight="normal" fill="#556575" text-anchor="start">S × H</text>
<text x="371.7" y="418.0" font-size="13" font-weight="600" fill="#7a4b06" text-anchor="start">received: 3SH/4</text>
<text x="371.7" y="435.0" font-size="13" font-weight="normal" fill="#7a4b06" text-anchor="start">= 4032·S elements, 75%</text>
