<text x="858.6" y="401.0" font-size="13" font-weight="normal" fill="#556575" text-anchor="start">S × A, written into the</text>
<text x="858.6" y="418.0" font-size="13" font-weight="normal" fill="#556575" text-anchor="start">attention kernels' buffers</text>
<text x="65.0" y="534.0" font-size="13" font-weight="600" fill="#26384b" text-anchor="start">Q/K/V/gate weights per GPU</text>
<rect x="295.0" y="522.0" width="60.0" height="14.0" rx="2" fill="#dfebfa" stroke="#627080" stroke-width="1.2"/>
<text x="365.0" y="534.0" font-size="13" font-weight="normal" fill="#556575" text-anchor="start">14 heads: 3.6 GiB (H × A per matrix, sharded by head)</text>
<text x="540.0" y="588.0" font-size="16" font-weight="bold" fill="#152638" text-anchor="middle">UniServe's two streams on one GPU (order only, not to scale)</text>
<text x="233.0" y="628.0" font-size="13" font-weight="normal" fill="#26384b" text-anchor="end">communication</text>
<text x="233.0" y="668.0" font-size="13" font-weight="normal" fill="#26384b" text-anchor="end">compute</text>
