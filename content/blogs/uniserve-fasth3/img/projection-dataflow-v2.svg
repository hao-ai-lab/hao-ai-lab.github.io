<text x="425.0" y="711.0" font-size="12" font-weight="normal" fill="#26384b" text-anchor="start" textLength="216.0" lengthAdjust="spacingAndGlyphs">rows that cross the input collective</text>
<rect x="671.0" y="700.0" width="26.0" height="13.0" rx="3" fill="#dfebfa" stroke="#627080" stroke-width="1"/>
<text x="705.0" y="711.0" font-size="12" font-weight="normal" fill="#26384b" text-anchor="start" textLength="120.0" lengthAdjust="spacingAndGlyphs">computed on this GPU</text>
<text x="540.0" y="736.0" font-size="11.5" font-weight="normal" fill="#556575" text-anchor="middle">The local rows are projected while chunk 1 is gathered. Each later chunk is projected and prepared once it lands,</text>
