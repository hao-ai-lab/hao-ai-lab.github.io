<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="t d">
<title id="t">A VSA2 attention layer</title>
<desc id="d">Rows are grouped into 128-row blocks: text blocks, then 4x4x8 video tiles. A gradient-free router pools queries and keys over 2x2x2 windows and keeps the top tile pairs per head plus the diagonal; text keys are always kept. The fine branch attends exactly within the kept tiles, the coarse branch attends densely between block means, and a zero-initialized learned gate mixes the coarse output in.</desc>
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .grid{stroke:#e4e3de} .axis{stroke:#9b9a95}
  .ln{stroke:#52514e;fill:none} .box{fill:#f3f2ee;stroke:#c9c7c0} .boxs{fill:#e6edf5;stroke:#33557d}
  .boxo{fill:#f6ebe3;stroke:#b86a3c} .boxg{fill:#e7f0e9;stroke:#4f7f5a}
  .s0{fill:#b5afa5} .s1{fill:#33557d} .s2{fill:#b86a3c} .s3{fill:#4f7f5a} .s4{fill:#7a5c8a}
  .k0{stroke:#b5afa5} .k1{stroke:#33557d} .k2{stroke:#b86a3c} .k3{stroke:#4f7f5a} .k4{stroke:#7a5c8a}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .grid{stroke:#2e2e2c} .axis{stroke:#6b6a66}
    .ln{stroke:#c3c2b7} .box{fill:#262624;stroke:#4a4945} .boxs{fill:#1f2a37;stroke:#7393bb}
    .boxo{fill:#33251c;stroke:#c27448} .boxg{fill:#1f2b22;stroke:#78a985}
    .s0{fill:#69655e} .s1{fill:#7393bb} .s2{fill:#c27448} .s3{fill:#78a985} .s4{fill:#a68bb5}
    .k0{stroke:#69655e} .k1{stroke:#7393bb} .k2{stroke:#c27448} .k3{stroke:#78a985} .k4{stroke:#a68bb5}
  }
</style>
<rect class="bg" width="780" height="400"/>
<text class="t1" x="24.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="700">One VSA2 attention layer (per head), as one fused forward and backward</text>
<rect class="box" x="24" y="60" width="190" height="110" rx="9" stroke-width="1.5"/>
<text class="t1" x="119.0" y="82.0" font-size="13" text-anchor="middle" font-weight="700">Rows in blocks</text>
<text class="t2" x="119.0" y="100.0" font-size="11.5" text-anchor="middle">text: dense prefix blocks</text>
<text class="t2" x="119.0" y="116.0" font-size="11.5" text-anchor="middle">video: 4×4×8 tiles</text>
<text class="t2" x="119.0" y="132.0" font-size="11.5" text-anchor="middle">(128 tokens each);</text>
<text class="t2" x="119.0" y="148.0" font-size="11.5" text-anchor="middle">first latent frame alone</text>
<rect class="boxo" x="270" y="50" width="230" height="72" rx="9" stroke-width="1.5"/>
<text class="t1" x="385.0" y="72.0" font-size="13" text-anchor="middle" font-weight="700">Router (no gradient)</text>
<text class="t2" x="385.0" y="90.0" font-size="11.5" text-anchor="middle">pool Q, K over 2×2×2 windows</text>
<text class="t2" x="385.0" y="106.0" font-size="11.5" text-anchor="middle">softmax → tile-pair scores</text>
<rect class="box" x="270" y="140" width="230" height="64" rx="9" stroke-width="1.5"/>
<text class="t1" x="385.0" y="162.0" font-size="13" text-anchor="middle" font-weight="700">Top-K per head</text>
<text class="t2" x="385.0" y="180.0" font-size="11.5" text-anchor="middle">N_v × K tile pairs + diagonal</text>
<text class="t2" x="385.0" y="196.0" font-size="11.5" text-anchor="middle">text keys always kept</text>
<line class="ln" x1="385" y1="122" x2="385" y2="140" stroke-width="1.6"/>
<path class="ln" d="M381.5,131.7 L385,140 L388.5,131.7" stroke-width="1.6"/>
<rect class="boxs" x="270" y="230" width="230" height="72" rx="9" stroke-width="1.5"/>
<text class="t1" x="385.0" y="252.0" font-size="13" text-anchor="middle" font-weight="700">Fine branch</text>
<text class="t2" x="385.0" y="270.0" font-size="11.5" text-anchor="middle">exact attention over the</text>
<text class="t2" x="385.0" y="286.0" font-size="11.5" text-anchor="middle">kept tiles (≈10% of video)</text>
<line class="ln" x1="385" y1="204" x2="385" y2="230" stroke-width="1.6"/>
<path class="ln" d="M381.5,221.7 L385,230 L388.5,221.7" stroke-width="1.6"/>
<rect class="boxg" x="270" y="318" width="230" height="64" rx="9" stroke-width="1.5"/>
<text class="t1" x="385.0" y="340.0" font-size="13" text-anchor="middle" font-weight="700">Coarse branch</text>
<text class="t2" x="385.0" y="358.0" font-size="11.5" text-anchor="middle">mean-pooled Q, K, V per block,</text>
<text class="t2" x="385.0" y="374.0" font-size="11.5" text-anchor="middle">dense over all blocks</text>
<line class="ln" x1="214" y1="100" x2="270" y2="86" stroke-width="1.6"/>
<path class="ln" d="M262.8,91.4 L270,86 L261.1,84.6" stroke-width="1.6"/>
<line class="ln" x1="214" y1="120" x2="270" y2="262" stroke-width="1.6"/>
<path class="ln" d="M263.7,255.6 L270,262 L270.2,253.0" stroke-width="1.6"/>
<line class="ln" x1="214" y1="150" x2="270" y2="345" stroke-width="1.6"/>
<path class="ln" d="M264.3,338.0 L270,345 L271.1,336.1" stroke-width="1.6"/>
<rect class="boxs" x="560" y="200" width="196" height="110" rx="9" stroke-width="1.5"/>
<text class="t1" x="658.0" y="222.0" font-size="13" text-anchor="middle" font-weight="700">Gated merge</text>
<text class="t2" x="658.0" y="240.0" font-size="11.5" text-anchor="middle">out = fine + g ⊙ coarse</text>
<text class="t2" x="658.0" y="256.0" font-size="11.5" text-anchor="middle">g = W_g x, per row,</text>
<text class="t2" x="658.0" y="272.0" font-size="11.5" text-anchor="middle">head and channel;</text>
<text class="t2" x="658.0" y="288.0" font-size="11.5" text-anchor="middle">zero-init, zero on text</text>
<line class="ln" x1="500" y1="266" x2="560" y2="255" stroke-width="1.6"/>
<path class="ln" d="M552.5,259.9 L560,255 L551.2,253.0" stroke-width="1.6"/>
<line class="ln" x1="500" y1="350" x2="560" y2="290" stroke-width="1.6"/>
<path class="ln" d="M556.6,298.3 L560,290 L551.7,293.4" stroke-width="1.6"/>
<text class="t2" x="560.0" y="340.0" font-size="11.5" text-anchor="start">attention reads ≈13–17% of</text>
<text class="t2" x="560.0" y="356.0" font-size="11.5" text-anchor="start">dense FLOPs at sparsity 0.9</text>
</svg>
