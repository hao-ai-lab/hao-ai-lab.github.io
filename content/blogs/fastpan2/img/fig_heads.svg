<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="t d">
<title id="t">The PDD head grid and its partitions</title>
<desc id="d">The student's output layer has 32 heads, one per interval of a fine time grid. Grouping 2, 4 or 8 consecutive heads per forward gives 16-, 8- or 4-call samplers from the same weights layout.</desc>
