<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
<title id="t">Per-forward transformer time, dense against VSA2</title>
<desc id="d">On one B300, one sample-forward costs 1.10 s dense vs 1.02 s with VSA2 at 5 s, 2.81 vs 2.17 s at 10 s, and 7.97 vs 4.77 s at 20 s; VSA2's attention does 17%, 14% and 13% of dense attention FLOPs.</desc>
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .grid{stroke:#e4e3de} .axis{stroke:#9b9a95}
  .ln{stroke:#52514e;fill:none} .box{fill:#f3f2ee;stroke:#c9c7c0} .boxs{fill:#e6edf5;stroke:#33557d}
  .boxo{fill:#f6ebe3;stroke:#b86a3c} .boxg{fill:#e7f0e9;stroke:#4f7f5a}
  .s0{fill:#b5afa5} .s1{fill:#33557d} .s2{fill:#b86a3c} .s3{fill:#4f7f5a} .s4{fill:#7a5c8a}
  .k0{stroke:#b5afa5} .k1{stroke:#33557d} .k2{stroke:#b86a3c} .k3{stroke:#4f7f5a} .k4{stroke:#7a5c8a}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .grid{stroke:#2e2e2c} .axis{stroke:#6b6a66}
    .ln{stroke:#c3c2b7} .box{fill:#262624;stroke:#4a4945} .boxs{fill:#1f2a37;stroke:#7393bb}
    .boxo{fill:#33251c;stroke:#c27448} .boxg{fill:#1f2b22;stroke:#78a985}
    .s0{fill:#69655e} .s1{fill:#7393bb} .s2{fill:#c27448} .s3{fill:#78a985} .s4{fill:#a68bb5}
    .k0{stroke:#69655e} .k1{stroke:#7393bb} .k2{stroke:#c27448} .k3{stroke:#78a985} .k4{stroke:#a68bb5}
  }
</style>
<rect class="bg" width="760" height="300"/>
<text class="t1" x="24.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="700">Transformer time per sample per forward on one B300 (seconds)</text>
<rect class="s0" x="24" y="44" width="12" height="12" rx="3"/><text class="t2" x="42.0" y="54.0" font-size="13" text-anchor="start">dense (PAN 2)</text>
<rect class="s1" x="157.60000000000002" y="44" width="12" height="12" rx="3"/><text class="t2" x="175.6" y="54.0" font-size="13" text-anchor="start">VSA2 at sparsity 0.9 (FastPAN2)</text>
<line class="grid" x1="120.0" x2="120.0" y1="70" y2="250"/><text class="t2" x="120.0" y="266.0" font-size="10.5" text-anchor="middle">0 s</text>
<line class="grid" x1="202.4" x2="202.4" y1="70" y2="250"/><text class="t2" x="202.4" y="266.0" font-size="10.5" text-anchor="middle">2 s</text>
<line class="grid" x1="284.7" x2="284.7" y1="70" y2="250"/><text class="t2" x="284.7" y="266.0" font-size="10.5" text-anchor="middle">4 s</text>
<line class="grid" x1="367.1" x2="367.1" y1="70" y2="250"/><text class="t2" x="367.1" y="266.0" font-size="10.5" text-anchor="middle">6 s</text>
<line class="grid" x1="449.4" x2="449.4" y1="70" y2="250"/><text class="t2" x="449.4" y="266.0" font-size="10.5" text-anchor="middle">8 s</text>
<text class="t1" x="108.0" y="104.0" font-size="12.5" text-anchor="end" font-weight="600">5 s clip</text>
<rect class="s0" x="120" y="78" width="45.3" height="18" rx="2"/><text class="t1" x="171.3" y="92.0" font-size="11.5" text-anchor="start">1.10</text>
<rect class="s1" x="120" y="100" width="42.0" height="18" rx="2"/><text class="t1" x="168.0" y="114.0" font-size="11.5" text-anchor="start" font-weight="600">1.02  (1.08×)</text>
<text class="t2" x="560.0" y="104.0" font-size="11.5" text-anchor="start">attention FLOPs: 17% of dense</text>
<text class="t1" x="108.0" y="164.0" font-size="12.5" text-anchor="end" font-weight="600">10 s clip</text>
<rect class="s0" x="120" y="138" width="115.7" height="18" rx="2"/><text class="t1" x="241.7" y="152.0" font-size="11.5" text-anchor="start">2.81</text>
<rect class="s1" x="120" y="160" width="89.4" height="18" rx="2"/><text class="t1" x="215.4" y="174.0" font-size="11.5" text-anchor="start" font-weight="600">2.17  (1.29×)</text>
<text class="t2" x="560.0" y="164.0" font-size="11.5" text-anchor="start">attention FLOPs: 14% of dense</text>
<text class="t1" x="108.0" y="224.0" font-size="12.5" text-anchor="end" font-weight="600">20 s clip</text>
<rect class="s0" x="120" y="198" width="328.2" height="18" rx="2"/><text class="t1" x="454.2" y="212.0" font-size="11.5" text-anchor="start">7.97</text>
<rect class="s1" x="120" y="220" width="196.4" height="18" rx="2"/><text class="t1" x="322.4" y="234.0" font-size="11.5" text-anchor="start" font-weight="600">4.77  (1.67×)</text>
<text class="t2" x="560.0" y="224.0" font-size="11.5" text-anchor="start">attention FLOPs: 13% of dense</text>
<text class="t2" x="24.0" y="290.0" font-size="10.5" text-anchor="start">Dense: 50-step CFG denoising / 100 sample-forwards (CFG is batched, which favors dense). VSA2: 8-call denoising / 8.</text>
</svg>
