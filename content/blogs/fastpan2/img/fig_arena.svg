<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="t d">
<title id="t">Human preference arena results</title>
<desc id="d">Win rates with 95% bootstrap intervals: FastPAN2 0.60 (0.52-0.69, 105 games), PAN 2 0.58 (0.50-0.66, 111), FastH3 8-step 0.43 (0.33-0.52, 98), Cosmos3-Super 0.34 (0.26-0.42, 109).</desc>
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .grid{stroke:#e4e3de} .axis{stroke:#9b9a95}
  .ln{stroke:#52514e;fill:none} .box{fill:#f3f2ee;stroke:#c9c7c0} .boxs{fill:#e6edf5;stroke:#33557d}
  .boxo{fill:#f6ebe3;stroke:#b86a3c} .boxg{fill:#e7f0e9;stroke:#4f7f5a}
  .s0{fill:#b5afa5} .s1{fill:#33557d} .s2{fill:#b86a3c} .s3{fill:#4f7f5a} .s4{fill:#7a5c8a}
  .k0{stroke:#b5afa5} .k1{stroke:#33557d} .k2{stroke:#b86a3c} .k3{stroke:#4f7f5a} .k4{stroke:#7a5c8a}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .grid{stroke:#2e2e2c} .axis{stroke:#6b6a66}
    .ln{stroke:#c3c2b7} .box{fill:#262624;stroke:#4a4945} .boxs{fill:#1f2a37;stroke:#7393bb}
    .boxo{fill:#33251c;stroke:#c27448} .boxg{fill:#1f2b22;stroke:#78a985}
    .s0{fill:#69655e} .s1{fill:#7393bb} .s2{fill:#c27448} .s3{fill:#78a985} .s4{fill:#a68bb5}
    .k0{stroke:#69655e} .k1{stroke:#7393bb} .k2{stroke:#c27448} .k3{stroke:#78a985} .k4{stroke:#a68bb5}
  }
</style>
<rect class="bg" width="760" height="250"/>
<text class="t1" x="24.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="700">Human preference arena: win rate against the rest of the pool (ties count ½)</text>
<line class="grid" x1="250.0" x2="250.0" y1="48" y2="200"/><text class="t2" x="250.0" y="216.0" font-size="10.5" text-anchor="middle">0.2</text>
<line class="grid" x1="325.0" x2="325.0" y1="48" y2="200"/><text class="t2" x="325.0" y="216.0" font-size="10.5" text-anchor="middle">0.3</text>
<line class="grid" x1="400.0" x2="400.0" y1="48" y2="200"/><text class="t2" x="400.0" y="216.0" font-size="10.5" text-anchor="middle">0.4</text>
<line class="grid" x1="475.0" x2="475.0" y1="48" y2="200"/><text class="t2" x="475.0" y="216.0" font-size="10.5" text-anchor="middle">0.5</text>
<line class="grid" x1="550.0" x2="550.0" y1="48" y2="200"/><text class="t2" x="550.0" y="216.0" font-size="10.5" text-anchor="middle">0.6</text>
<line class="grid" x1="625.0" x2="625.0" y1="48" y2="200"/><text class="t2" x="625.0" y="216.0" font-size="10.5" text-anchor="middle">0.7</text>
<line class="grid" x1="700.0" x2="700.0" y1="48" y2="200"/><text class="t2" x="700.0" y="216.0" font-size="10.5" text-anchor="middle">0.8</text>
<line class="axis" x1="475.0" x2="475.0" y1="48" y2="200" stroke-dasharray="4 3"/><text class="t1" x="238.0" y="74.0" font-size="12" text-anchor="end" font-weight="600">FastPAN2, 8 calls (released)</text>
<text class="t2" x="238.0" y="87.0" font-size="10" text-anchor="end">105 games</text>
<line class="k1" x1="488.5" x2="613.8" y1="70" y2="70" stroke-width="3" stroke-linecap="round"/><circle class="s1" cx="550.0" cy="70" r="6.5"/><text class="t1" x="621.8" y="74.0" font-size="12" text-anchor="start">0.60</text>
<text class="t1" x="238.0" y="110.0" font-size="12" text-anchor="end">PAN 2, 50 steps + CFG</text>
