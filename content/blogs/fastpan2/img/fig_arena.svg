<line class="k4" x1="475.0" x2="595.0" y1="106" y2="106" stroke-width="3" stroke-linecap="round"/><circle class="s4" cx="535.8" cy="106" r="6.5"/><text class="t1" x="603.0" y="110.0" font-size="12" text-anchor="start">0.58</text>
<text class="t1" x="238.0" y="146.0" font-size="12" text-anchor="end">FastH3, 8 steps (t2v only)</text>
<text class="t2" x="238.0" y="159.0" font-size="10" text-anchor="end">98 games</text>
<line class="k2" x1="349.8" x2="490.0" y1="142" y2="142" stroke-width="3" stroke-linecap="round"/><circle class="s2" cx="421.8" cy="142" r="6.5"/><text class="t1" x="498.0" y="146.0" font-size="12" text-anchor="start">0.43</text>
<text class="t1" x="238.0" y="182.0" font-size="12" text-anchor="end">Cosmos3-Super, 35 steps</text>
<text class="t2" x="238.0" y="195.0" font-size="10" text-anchor="end">109 games</text>
<line class="k0" x1="295.8" x2="416.5" y1="178" y2="178" stroke-width="3" stroke-linecap="round"/><circle class="s0" cx="351.2" cy="178" r="6.5"/><text class="t1" x="424.5" y="182.0" font-size="12" text-anchor="start">0.34</text>
<text class="t2" x="24.0" y="240.0" font-size="10.5" text-anchor="start">275 votes from 8 raters on 141 prompts (t2v and i2v, 5–20 s); bars: 95% bootstrap intervals over votes.</text>
</svg>
