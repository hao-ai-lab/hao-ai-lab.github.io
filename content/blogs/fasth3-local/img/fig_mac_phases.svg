  <text x="236.0" y="179.0" class="lbl" text-anchor="end">Cached prompt</text>
  <rect x="250.0" y="160.0" width="559.6" height="24.0" rx="3" fill="#3b7dd8"/>
  <text x="529.8" y="177.0" class="vsw" text-anchor="middle">341 s</text>
  <rect x="809.6" y="160.0" width="170.6" height="24.0" rx="3" fill="#f0b429"/>
  <text x="894.9" y="177.0" class="vsw" text-anchor="middle">104 s</text>
  <rect x="980.2" y="160.0" width="9.8" height="24.0" rx="3" fill="#cbd3e0"/>
  <text x="1000.0" y="177.0" class="val" text-anchor="start">451 s</text>
  <text x="236.0" y="221.0" class="lbl" text-anchor="end">Cached · TAEH3</text>
  <rect x="250.0" y="202.0" width="724.6" height="24.0" rx="3" fill="#3b7dd8"/>
  <text x="612.3" y="219.0" class="vsw" text-anchor="middle">343 s</text>
  <rect x="974.6" y="202.0" width="2.1" height="24.0" rx="3" fill="#f0b429"/>
  <rect x="976.7" y="202.0" width="13.3" height="24.0" rx="3" fill="#cbd3e0"/>
  <text x="1000.0" y="219.0" class="val" text-anchor="start">350 s</text>
