<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="488" viewBox="0 0 1160 488" role="img" aria-label="Mac time and memory through one generation">
  <rect x="0" y="0" width="1160" height="488" fill="#ffffff"/>
  <defs><style>
    .t   { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #1f2a44; }
    .st  { font: 500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #5d687c; }
    .lbl { font: 600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #1f2a44; }
    .sub { font: 500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #5d687c; }
    .tick{ font: 500 11px ui-monospace,SFMono-Regular,Menlo,monospace; fill: #7a8699; }
    .val { font: 700 13px ui-monospace,SFMono-Regular,Menlo,monospace; fill: #1f2a44; }
    .vsw { font: 600 11px ui-monospace,SFMono-Regular,Menlo,monospace; fill: #ffffff; }
    .na  { font: italic 500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #93a0b4; }
    .cap { font: 500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #6b7688; }
  </style></defs>
  <text x="40" y="36" class="t">Time and memory through one Mac generation</text>
  <text x="40" y="58" class="st">M4 Max · 36 GB unified memory · 832×480 · 124 frames</text>
  <rect x="250.0" y="78.0" width="13.0" height="13.0" rx="3" fill="#7b8bb5"/>
  <text x="270.0" y="89.0" class="sub" text-anchor="start">prompt</text>
  <rect x="415.0" y="78.0" width="13.0" height="13.0" rx="3" fill="#3b7dd8"/>
  <text x="435.0" y="89.0" class="sub" text-anchor="start">denoise</text>
  <rect x="580.0" y="78.0" width="13.0" height="13.0" rx="3" fill="#f0b429"/>
  <text x="600.0" y="89.0" class="sub" text-anchor="start">decode</text>
  <rect x="745.0" y="78.0" width="13.0" height="13.0" rx="3" fill="#cbd3e0"/>
  <text x="765.0" y="89.0" class="sub" text-anchor="start">other</text>
  <text x="236.0" y="137.0" class="lbl" text-anchor="end">First prompt</text>
