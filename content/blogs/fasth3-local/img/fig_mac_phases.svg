  <text x="420.0" y="289.0" class="sub" text-anchor="start">peak decode</text>
  <line x1="250.0" y1="306.0" x2="250.0" y2="420.0" stroke="#e8ecf2" stroke-width="1"/>
  <text x="250.0" y="438.0" class="tick" text-anchor="middle">0 GiB</text>
  <line x1="414.4" y1="306.0" x2="414.4" y2="420.0" stroke="#e8ecf2" stroke-width="1"/>
  <text x="414.4" y="438.0" class="tick" text-anchor="middle">8 GiB</text>
  <line x1="578.9" y1="306.0" x2="578.9" y2="420.0" stroke="#e8ecf2" stroke-width="1"/>
  <text x="578.9" y="438.0" class="tick" text-anchor="middle">16 GiB</text>
  <line x1="743.3" y1="306.0" x2="743.3" y2="420.0" stroke="#e8ecf2" stroke-width="1"/>
  <text x="743.3" y="438.0" class="tick" text-anchor="middle">24 GiB</text>
  <line x1="907.8" y1="306.0" x2="907.8" y2="420.0" stroke="#e8ecf2" stroke-width="1"/>
  <text x="907.8" y="438.0" class="tick" text-anchor="middle">32 GiB</text>
  <text x="236.0" y="322.0" class="lbl" text-anchor="end">First prompt</text>
  <rect x="250.0" y="306.0" width="400.2" height="13.0" rx="3" fill="#3b7dd8"/>
  <text x="658.2" y="317.0" class="val" text-anchor="start">19.5 GiB</text>
  <rect x="250.0" y="321.0" width="226.7" height="13.0" rx="3" fill="#f0b429"/>
  <text x="484.7" y="332.0" class="val" text-anchor="start">11.0 GiB</text>
  <text x="236.0" y="358.0" class="lbl" text-anchor="end">Cached prompt</text>
  <rect x="250.0" y="342.0" width="400.2" height="13.0" rx="3" fill="#3b7dd8"/>
  <text x="658.2" y="353.0" class="val" text-anchor="start">19.5 GiB</text>
  <rect x="250.0" y="357.0" width="226.7" height="13.0" rx="3" fill="#f0b429"/>
  <text x="484.7" y="368.0" class="val" text-anchor="start">11.0 GiB</text>
  <text x="236.0" y="394.0" class="lbl" text-anchor="end">Cached · TAEH3</text>
  <rect x="250.0" y="378.0" width="400.2" height="13.0" rx="3" fill="#3b7dd8"/>
  <text x="658.2" y="389.0" class="val" text-anchor="start">19.5 GiB</text>
  <rect x="250.0" y="393.0" width="74.4" height="13.0" rx="3" fill="#f0b429"/>
  <text x="332.4" y="404.0" class="val" text-anchor="start">3.6 GiB</text>
  <text x="40.0" y="460.0" class="cap" text-anchor="start">Cached rows reuse the prompt embedding. TAEH3 is preview decode. Peaks are MLX stage peaks, not whole-system memory.</text>
</svg>
