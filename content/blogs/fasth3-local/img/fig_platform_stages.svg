<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="352" viewBox="0 0 1160 352" role="img" aria-label="Wall clock breakdown by stage, first generation versus repeat">
  <rect x="0" y="0" width="1160" height="352" fill="#ffffff"/>
  <defs><style>
    .t   { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #1f2a44; }
