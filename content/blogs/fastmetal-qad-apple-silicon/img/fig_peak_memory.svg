  <text x="40.0" y="660.0" class="cap" text-anchor="start">Nameplate RAM is decimal, so a 24 GB Mac holds 22.35 GiB. macOS and running apps claim several GiB on top, so a peak near a line will not fit that machine in practice.</text>
