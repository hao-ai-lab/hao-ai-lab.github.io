  <text x="766.9" y="216.0" class="val" text-anchor="start">0.092</text>
  <text x="832.9" y="216.0" class="vs" text-anchor="start">16.7× INT8</text>
  <text x="234.0" y="268.0" class="lbl" text-anchor="end">NVFP4 (4.5 bits)</text>
