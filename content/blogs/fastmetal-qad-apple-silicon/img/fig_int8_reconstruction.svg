  <line x1="250.0" y1="356.0" x2="940.0" y2="356.0" stroke="#c8d0dc" stroke-width="1"/>
  <text x="40.0" y="412.0" class="cap" text-anchor="start">Per-group scaling already supplies dynamic range, so affine INT8 can spend all eight bits on 256 uniform levels across the group's actual range.</text>
