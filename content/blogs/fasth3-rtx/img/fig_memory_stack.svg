<svg xmlns="http://www.w3.org/2000/svg" width="760" height="242" viewBox="0 0 760 242" role="img" aria-labelledby="t d"><title id="t">Checkpoint size by component</title><desc id="d">BF16 H3 is 137.7 GiB (text encoder 62.1, DiT 65.3, VAEs 10.3). The FastH3 Trim NVFP4 release is 33.0 GiB (text encoder 15.3, DiT 11.1, VAEs 6.5), 4.2 times smaller.</desc>
