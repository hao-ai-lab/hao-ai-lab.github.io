name: Archive settled blog media

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify the proposed migration without uploading or opening a PR
        type: boolean
        default: true

concurrency:
  group: archive-blog-media
  cancel-in-progress: false

jobs:
  archive:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Hugo and Dart Sass
        env:
          HUGO_VERSION: 0.123.0
          DART_SASS_VERSION: 1.77.8
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" hugo
          curl -fsSL --retry 3 \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
      - name: Verify media and prepare migration PR
        env:
          MEDIA_ARCHIVE_PR_TOKEN: ${{ secrets.MEDIA_ARCHIVE_PR_TOKEN }}
        run: python3 tools/archive_blog_media.py
