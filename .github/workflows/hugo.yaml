# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - instructions/**

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and upload the artifact without deploying
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ${{ inputs.build_only && format('pages-build-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-26.04
    env:
      HUGO_VERSION: 0.123.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: 1.77.8
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/dart-sass.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/dart-sass/sass" --version
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Fingerprint Hugo image sources
        id: image-key
        run: |
          digest=$(git ls-tree -r HEAD -- content static assets themes hugo.yaml |
            awk '/\.(avif|bmp|gif|jpe?g|png|svg|tiff?|webp)$|[[:space:]]hugo\.yaml$/ { print }' |
            sha256sum | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Cache Hugo image transforms
        uses: actions/cache@v6.1.0
        with:
          path: resources/_gen/images
          key: hugo-images-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-${{ steps.image-key.outputs.digest }}
          restore-keys: hugo-images-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Check Pages bundle size
        run: |
          bytes=$(du -sb public | cut -f1)
          echo "Pages bundle size: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
          if (( bytes > 1000000000 )); then
            echo "::error::Pages bundle is $bytes bytes and exceeds the 1 GB limit. Host large demo media outside the Pages bundle."
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./public
          include-hidden-files: true

  # Deployment job
  deploy:
    if: ${{ !inputs.build_only }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          reporting_interval: 2000
