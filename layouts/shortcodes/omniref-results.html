<section class="omni-results" aria-label="FastH3 Omni speedup over Base">
  <p class="omni-chart-note">Speedup = Base mean generation time / FastH3 Omni mean generation time. Higher is better; 1× is Base speed. All results use eight GB200 GPUs, 1344×768 video and audio.</p>
  {{- range $seconds := slice 5 10 15 }}
  <figure class="omni-chart" data-omni-speedup-chart="{{ $seconds }}">
    <h3>{{ $seconds }}-second outputs</h3>
    <div class="omni-chart-scroll">
      <img src="img/speedup-{{ $seconds }}s.svg" width="1100" height="480"
        alt="FastH3 Omni speedup over Base for {{ $seconds }}-second outputs across nine reference compositions. Higher bars are faster. Both lanes use the original video VAE.">
    </div>
  </figure>
  {{- end }}
  <p class="omni-data-links">Download the <a href="{{ (.Page.Resources.GetMatch "data/latency.csv").RelPermalink }}">timing CSV</a> or <a href="{{ (.Page.Resources.GetMatch "data/benchmark.json").RelPermalink }}">prompts, inputs and results JSON</a>.</p>
</section>
<style>
.omni-results{margin:1.6rem 0 2rem}.omni-chart{margin:1.5rem 0 2rem}.omni-chart h3{font-size:1.1rem;margin:.5rem 0}.omni-chart-scroll{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:10px}.omni-chart img{display:block;width:100%;min-width:600px;height:auto;margin:0}.omni-chart-note,.omni-data-links{font-size:.8rem;line-height:1.6;color:var(--secondary);text-indent:0!important}.omni-results a:focus-visible{outline:3px solid #168a70;outline-offset:3px}
@media(max-width:650px){.footer span:last-child{white-space:normal}}
</style>
